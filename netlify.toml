[build]
  publish = "site"
  functions = "netlify/functions"

[[redirects]]
  from = "/him"
  to = "/him.html"
  status = 200

[[redirects]]
  from = "/her"
  to = "/her.html"
  status = 200

[[redirects]]
  from = "/watches"
  to = "/watches.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
